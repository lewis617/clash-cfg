# 私有层示例：复制成你自己本地的 overlay.yml（不要提交进仓库）。
#
#   cp overlay.example.yml ~/.config/mihomo/local/overlay.yml
#   node merge.js --base clash-cfg.yml \
#                 --overlay ~/.config/mihomo/local/overlay.yml \
#                 --out ~/.config/mihomo/config.yaml
#
# 分层原则：能用 mihomo 自带机制就用自带机制。
#   私有域名/规则的具体内容 → 交给原生 file provider（ruleset/local-*.yml），改完不用重新合并
#   本文件只放「无法外置的声明」：proxy-groups（mihomo 只能写在 config 里）+ 对本地 provider 的引用
#
# 所以下面三个段落基本一次写好就不再动，日常只改 ruleset/local-*.yml。

# ① 自己的分组（mihomo 没有 include/merge，分组只能写在 config 里）
proxy-groups:
  - name: MY-NODES
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 600
    timeout: 5000
    lazy: true
    expected-status: 204

# ② 声明本地 file provider（内容在你自己的文件里，不进仓库）
rule-providers:
  local-domains:                 # 私有域名 → 同时决定 fake-ip 白名单和分流
    type: file
    behavior: domain
    format: yaml
    path: ./ruleset/local-domains.yml
  local-rules:                   # 私有规则，可写任意规则类型
    type: file
    behavior: classical
    format: yaml
    path: ./ruleset/local-rules.yml

# ③ 把本地 provider 接进规则链最前面（在最前才不会被后面的 GEOSITE,gfw / MATCH 抢先命中）
#    classical 型引用时必须带 target，否则报 proxy [local-rules] not found
rules_prepend:
  - RULE-SET,local-rules,MY-NODES

# ④ 私有域名要拿到 fake-ip，否则 DNS 返回真实 IP，流量根本不过 mihomo
dns:
  fake-ip-filter_append:
    - 'rule-set:local-domains'

# ---------------------------------------------------------------------------
# 对应规则文件示例（放在 mihomo 配置目录下，路径与上面 path 一致）：
#
# ruleset/local-domains.yml          # behavior: domain
#   payload:
#     - '+.example.com'
#
# ruleset/local-rules.yml            # behavior: classical
#   payload:
#     - 'DOMAIN-SUFFIX,example.net,DIRECT'
#     - 'GEOSITE,category-xxx,MY-NODES'
#
# 改完这两个文件不必重新合并，让 mihomo 重读即可：
#   curl -X PUT http://127.0.0.1:9090/providers/rules/local-domains
#   curl -X PUT http://127.0.0.1:9090/providers/rules/local-rules
# ---------------------------------------------------------------------------
