port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
allow-lan: true
mode: rule
external-controller: '0.0.0.0:9090'
external-ui: './ui'
ipv6: false
# mihomo 自带的持久化：记住 select 组手选的节点、以及 fake-ip 映射，
# 重载/重启后不会重置（否则每次热重载都要重新点一遍）。
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # whitelist 模式：只有下面列出的域名返回 fake-ip(198.18.x.x)，
  # 其余域名一律返回真实 IP。这样 4a 只需要把 198.18.0.0/16 路由给本机，
  # 直连流量完全不经本机（本机网口只有百兆）。
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - 'geosite:gfw'
    - 'geosite:github'
    - 'rule-set:custom-proxy'
    # 私有域名不在本仓库：本机 overlay 会追加 'rule-set:local-domains'（见 readme「本地私有层」）
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 原来是 system，但 4a 的 dnsmasq 即将把上游指向本机 1053 端口，
  # system 会绕回 4a → 4a 又转发给本机，形成解析环路。改用公共 DNS。
  direct-nameserver:
    - 223.5.5.5
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  # 内网域名直接问 4a，避免环路
  nameserver-policy:
    '+.lan': '192.168.1.1'
    '+.local': '192.168.1.1'
    '+.home.arpa': '192.168.1.1'
proxies: []
proxy-groups:
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/GitHub.png
    include-all: true
    interval: 600
    lazy: true
    name: GITHUB
    timeout: 10000
    type: url-test
    url: https://github.com/robots.txt
    expected-status: 200
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    include-all: true
    interval: 600
    lazy: true
    name: AUTO
    timeout: 10000
    type: url-test
    url: https://www.youtube.com
    expected-status: 200
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    name: PROXY
    type: select
    include-all: true
    proxies:
      - AUTO
proxy-providers:
  clashfree:
    filter: null
    interval: 3600
    type: "http"
    path: "./clash-provider.yml"
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/provider/clash-provider.yml"

tunnels:
rule-providers:
  custom-proxy:
    type: http
    behavior: domain
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/main/ruleset/custom-proxy.yml"
    path: ./ruleset/custom-proxy.yml
    interval: 86400
    format: yaml
  custom-direct:
    type: http
    behavior: domain
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/main/ruleset/custom-direct.yml"
    path: ./ruleset/custom-direct.yml
    interval: 86400
    format: yaml
rules:
  - DOMAIN,cdn.jsdelivr.net,DIRECT
  - DOMAIN,testingcf.jsdelivr.net,DIRECT
  - DOMAIN-SUFFIX,gh-proxy.com,DIRECT
  # 私有规则不在本仓库：本机 overlay 以 RULE-SET,local-rules,<target> 注入到最前面
  - RULE-SET,custom-proxy,PROXY
  - RULE-SET,custom-direct,DIRECT

  - GEOSITE,github,GITHUB
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,gfw,PROXY

  - IP-CIDR,127.0.0.0/8,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
