port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
allow-lan: true
mode: rule
external-controller: '0.0.0.0:9090'
external-ui: './ui'
ipv6: false
# mihomo 自带的持久化。store-selected 刻意关掉：
# url-test 组只要「手选节点还活着」就直接用它，不比较延迟（urltest.go 的 fast()），
# 加上持久化就等于把 url-test 退化成 select —— 手选的节点慢或半死不活时，
# 组不会自己回到最快节点。需要固定某个节点时走 PROXY 这个 select 组。
profile:
  store-selected: false
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # whitelist 模式：只有下面列出的域名返回 fake-ip(198.18.x.x)，
  # 其余域名一律返回真实 IP。这样 4a 只需要把 198.18.0.0/16 路由给本机，
  # 直连流量完全不经本机（本机网口只有百兆）。
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - 'geosite:gfw'
    - 'geosite:github'
    - 'rule-set:custom-proxy'
    # 额外域名由本机私有层追加（overlay 的 dns.fake-ip-filter_append，不在本仓库）
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 原来是 system，但 4a 的 dnsmasq 即将把上游指向本机 1053 端口，
  # system 会绕回 4a → 4a 又转发给本机，形成解析环路。改用公共 DNS。
  direct-nameserver:
    - 223.5.5.5
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  # 内网域名直接问 4a，避免环路
  nameserver-policy:
    '+.lan': '192.168.1.1'
    '+.local': '192.168.1.1'
    '+.home.arpa': '192.168.1.1'
proxies: []
# 关于 url-test 组的几个坑（都是实测 + 源码确认过的）：
#
# 1. 测速 URL 要尽量少、要轻。所有组注册的不同 URL 会在同一个体检队列里排队执行
#    （并发上限硬编码为 10），节点数 × URL 数直接决定一轮体检的耗时。实测 228 个
#    节点 × 3 个 URL 时一轮要 5~6 分钟，interval 设成多少都改变不了这个节奏。
#    所以这里统一用 generate_204（返回 204、body 为空），别再加大页面。
# 2. 别用 lazy: true。它只会传给「由 proxies 列表构造的 CompatibleProvider」，
#    对 include-all 的组等于没写，写了反而误导。真正省资源的方法是减少 URL 数量。
# 3. max-failed-times 配合 timeout 决定「多久才会主动补一次体检」：失败计数一旦
#    距首次失败超过 timeout 就清零，而死节点恰恰是每次超时 timeout 才失败，
#    门槛设高了（默认 5）很容易永远攒不满。设 2 让它更快掉头。
proxy-groups:
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/GitHub.png
    include-all: true
    interval: 300
    max-failed-times: 2
    name: GITHUB
    timeout: 10000
    type: url-test
    url: https://github.com/robots.txt
    expected-status: 200
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Auto.png
    include-all: true
    interval: 300
    max-failed-times: 2
    name: AUTO
    timeout: 10000
    type: url-test
    # 用 youtube 的 204 端点而不是首页：仍然验证「YouTube 通不通」，
    # 但不再让 228 个节点各拉一次首页的 HEAD。
    url: https://www.youtube.com/generate_204
    expected-status: 204
  - icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Proxy.png
    name: PROXY
    type: select
    include-all: true
    proxies:
      - AUTO
proxy-providers:
  clashfree:
    filter: null
    # 这个 health-check 块必须存在，否则定时体检根本不会启动：
    # provider 的 Initial() 里是 `if healthCheck.auto() { go process() }`，
    # 而 auto() 等价于 interval != 0，NewHealthCheck 在 url 为空时会把 interval 置 0。
    # 组通过 RegisterHealthCheckTask 注册自己的测速 URL 发生在 Initial() 之后，
    # 那时 ticker 已经决定不启动了 —— 于是只有「拨号失败」才会触发一次性体检，
    # 没人上网的一天里一次都不跑，回来一用就撞上昨天还活着的死节点。
    # 配了这里之后 ticker 才真正起来，组的 interval 才有意义。
    # lazy 必须显式写 false：parser.go 里 healthCheckSchema 的默认值就是 Lazy: true，
    # 那样 ticker 虽然起来了，但只要 interval 内没人用这个 provider 就跳过体检——
    # 无人值守的空闲白天照样一次都不跑。
    health-check:
      enable: true
      lazy: false
      url: https://www.youtube.com/generate_204
      expected-status: 204
      interval: 300
    interval: 3600
    type: "http"
    path: "./clash-provider.yml"
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/provider/clash-provider.yml"

tunnels:
rule-providers:
  custom-proxy:
    type: http
    behavior: domain
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/main/ruleset/custom-proxy.yml"
    path: ./ruleset/custom-proxy.yml
    interval: 86400
    format: yaml
  custom-direct:
    type: http
    behavior: domain
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/lewis617/clash-cfg/main/ruleset/custom-direct.yml"
    path: ./ruleset/custom-direct.yml
    interval: 86400
    format: yaml
rules:
  - DOMAIN,cdn.jsdelivr.net,DIRECT
  - DOMAIN,testingcf.jsdelivr.net,DIRECT
  - DOMAIN-SUFFIX,gh-proxy.com,DIRECT
  # 私有规则不在本仓库：本机 overlay 以 RULE-SET,local-rules,<target> 注入到最前面
  - RULE-SET,custom-proxy,PROXY
  - RULE-SET,custom-direct,DIRECT

  - GEOSITE,github,GITHUB
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,gfw,PROXY

  - IP-CIDR,127.0.0.0/8,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
